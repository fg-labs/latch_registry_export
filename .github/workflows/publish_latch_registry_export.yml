name: publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: 0.12.0

jobs:
  on-main-branch-check:
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.contains_tag.outputs.retval }}
    steps:
      # TODO: remove this and the `git branch -a` when the following PR
      # is merged and released:
      #   https://github.com/rickstaa/action-contains-tag/pull/18
      - name: git config --global remote.origin.followRemoteHEAD never
        run: git config --global remote.origin.followRemoteHEAD never

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: rickstaa/action-contains-tag@a9ff27d505ba2bf074a2ebb48b208e76d35ff308  # v1.2.10
        id: contains_tag
        with:
          reference: "main"
          tag: "${{ github.ref_name }}"

  tests:
    name: tests
    needs: on-main-branch-check
    if: ${{ needs.on-main-branch-check.outputs.on_main == 'true' }}
    uses: "./.github/workflows/python_package.yml"

  build:
    name: build package
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: 3.12
          enable-cache: 'true'
          cache-suffix: 3.12

      - name: Build sdist and wheel
        run: uv build --sdist --wheel

      - name: Verify package metadata
        run: uv run --with twine twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Install what we are about to publish and exercise it. `twine check` only renders
  # the README and parses metadata -- it never installs the artifact.
  verify-install:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        PYTHON_VERSION: ["3.12", "3.13", "3.14"]
        DIST: [whl, tar.gz]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          # `enable-cache` defaults to `auto`, which is on for GitHub-hosted runners.
          # This job exists to prove the artifact installs from a clean slate, so
          # resolve against upstream rather than a warm cache.
          enable-cache: 'false'

      - name: Import the built distribution
        run: |
          uv run --no-project \
            --python ${{ matrix.PYTHON_VERSION }} \
            --with dist/*.${{ matrix.DIST }} \
            python -P - <<'PY'
          import importlib, pkgutil
          import latch_registry_export as pkg
          for mod in pkgutil.walk_packages(pkg.__path__, pkg.__name__ + "."):
              importlib.import_module(mod.name)
          print("imported all submodules of", pkg.__name__)
          PY

      - name: Run the console script
        run: >
          uv run --no-project
          --python ${{ matrix.PYTHON_VERSION }}
          --with dist/*.${{ matrix.DIST }}
          latch_registry_export --version

  publish-to-pypi:
    runs-on: ubuntu-latest
    needs: [build, verify-install]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          skip-existing: true
          print-hash: true
          verbose: true

  make-changelog:
    runs-on: ubuntu-latest
    needs: publish-to-pypi
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout the Repository at the Tagged Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Generate a Changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4.8.0
        id: git-cliff
        with:
          config: pyproject.toml
          args: --latest --verbose
        env:
          GITHUB_REPO: ${{ github.repository }}

  make-github-release:
    runs-on: ubuntu-latest
    environment: github
    permissions:
      contents: write
      pull-requests: read
    needs: make-changelog
    steps:
      - name: Download the built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body: ${{ needs.make-changelog.outputs.release_body }}
          draft: false
          prerelease: false
          files: "dist/*"
